version: '3.8'

# Kafka/Zookeeper, Spark, Cassandra, Grafana, TorchServe (inference-engine) and
# video-generator were removed: not used by the GCP architecture.
# Original: _archive/irrelevant/originals/docker-compose.yml

services:
  # --- Web: Frontend (Nginx) ---
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - vision-module

  # --- Edge: Vision Module (FasterRCNN object detection) ---
  vision-module:
    build:
      context: .
      dockerfile: edge/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - WEBCAM_INDEX=0
      - DETECTION_THRESHOLD=0.7
    # devices:
    #   - /dev/video0:/dev/video0  # Uncomment if running on Linux with webcam

  # --- Monitoring: Prometheus ---
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
